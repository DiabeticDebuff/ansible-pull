---

- name: Basic Setup
  hosts: localhost
  connection: local
  become: true

  vars_file:
    - vars/main.yml


  tasks:

    - name: Install packages, keep them updated
      ansible.builtin.packages:
        name: "{{ packages }}"
        state: latest
      
    - name: Set System Timezone
      ansible.builtin.file:
        src: "/usr/share/zoneinfo/{{ system_timezone }}"
        dest: /etc/localtime
        state: link
        force: true


    - name: Create Admin User
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: "{{ admin_group}}"
        append: true
        shell: /bin/bash
        create_home: true

    - name: Allow Admin Group To Access sudo Without Password 
      ansible.builtin.copy:
        content: "%{{ admin_group }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: /etc/sudoers.d/99-ansible
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"


    - name: Message Of The Day
      ansible.builtin.copy:
        content: |
        **************
        {{ ansible_facts['hostname'] }} is managed by ansible-pull
        {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
        Last Applied: {{ ansible_date_time.iso8601 }}
        **************
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"

    - name: Make Sure Service Is Enabled And Running
      ansible.builtin.service:
        name: "{{ managed_service }}"
        state: started
        enabled: true


    - name: Schedule ansible-pull to run every 30 minutes
      ansible.bultin.cron:
        name: ansible-pull
        user: root
        minute: "*/30"
        job: "/usr/bin/ansible-pull -o -U {{ ansible_pull_repo }} >> /var/log/ansible-pull.log"
        cron_file: ansible-pull
             
          
           
        
